[workspace]
members = [".", "crates/stormsewer"]
resolver = "2"

[package]
name = "opencad-storm-sewer-plugin"
version = "0.3.6"
edition = "2021"
description = "Storm Sewer hydraulics add-on for Open CAD Studio — external cdylib plugin."
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to the OCS release the plugin is built for (v2026.42 = plugin API 10).
# The host rejects a plugin whose acadrust/rustc fingerprint differs, so bump
# this rev, the acadrust rev below, `api_version` in plugin.toml and
# ocs-host.lock together. Since v2026.42 upstream's codec lives in
# opencadcodec and ocs_plugin_api names it by the same URL and rev, so no
# [patch] is needed: both resolve to one crate.
ocs_plugin_api = { git = "https://github.com/HakanSeven12/OpenCADStudio", rev = "b6fbac39ffc74398ba5d283ce2bc1dc07a8fd8f0", features = ["host"] }
acadrust = { git = "https://github.com/HakanSeven12/opencadcodec.git", rev = "5d4f11a", features = ["serde"] }
stormsewer = { path = "crates/stormsewer" }
# Pro license activation (SS_ACTIVATE): JSON license file + online key validation.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }