[workspace]
members = [".", "crates/stormsewer"]
resolver = "2"

[package]
name = "opencad-storm-sewer-plugin"
version = "0.3.2"
edition = "2021"
description = "Storm Sewer hydraulics add-on for Open CAD Studio — external cdylib plugin."
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to the OCS release the plugin is built for (v2026.36 = plugin API 5).
# The host rejects a plugin whose acadrust/rustc fingerprint differs, so bump
# this rev, the acadrust rev below, and `api_version` in plugin.toml together.
ocs_plugin_api = { git = "https://github.com/HakanSeven12/OpenCADStudio", rev = "ddbbdd27ba51b79a93e9087c68d7387cd826432b", features = ["host"] }
acadrust = { git = "https://git@github.com/HakanSeven12/cadcodec.git", rev = "5b56571a190e7a17c8f12d36390d2938b0fb72f7", features = ["serde"] }
stormsewer = { path = "crates/stormsewer" }
# Pro license activation (SS_ACTIVATE): JSON license file + online key validation.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

# ocs_plugin_api depends on cadcodec at an older rev; redirect it to the exact
# rev the host was built with (same trick as the upstream root Cargo.toml).
[patch."https://github.com/HakanSeven12/cadcodec.git"]
acadrust = { git = "https://git@github.com/HakanSeven12/cadcodec.git", rev = "5b56571a190e7a17c8f12d36390d2938b0fb72f7" }